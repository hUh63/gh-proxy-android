apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.tencent.ghproxy'
    compileSdk 34

    defaultConfig {
        applicationId "com.tencent.ghproxy"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // ABI filters: modern devices (arm64) + emulator (x86_64)
        ndk {
            abiFilters += ['arm64-v8a', 'x86_64']
        }

        // Chaquopy Python 配置（嵌入在 android.defaultConfig 内）
        python {
            pip {
                install "fastapi==0.115.0"
                install "uvicorn[standard]==0.30.6"
                install "httpx==0.27.2"
                install "anyio==4.4.0"
                install "sniffio==1.3.1"
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with debug key for self-distribution; replace with your own key for Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }

    // Chaquopy Python 源码目录
    sourceSets {
        main {
            python.srcDirs = ['src/main/python']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}