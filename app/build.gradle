apply plugin: 'com.android.application'
apply plugin: 'com.chaquo.python'

android {
    namespace 'com.tencent.ghproxy'
    compileSdk 34

    defaultConfig {
        applicationId "com.tencent.ghproxy"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "1.0.1"

        // ABI：仅 arm64-v8a（覆盖 99%+ 现代手机，APK 体积最小）
        // 如需模拟器支持，加回 'x86_64'；如需老设备(32位)支持，需 Python 3.11 + 'armeabi-v7a'
        ndk {
            abiFilters += ['arm64-v8a']
        }

        // ============ Chaquopy Python 配置 ============
        python {
            // 显式指定 build Python，避免系统默认 python3 与 Chaquopy 12 内置 pip 兼容性问题
            buildPython "python3.10"
            pip {
                // ⚠️ Chaquopy 12 内置 pip 基于 2018 年代码：
                //   1) 无法解析 pyproject.toml-only 包 → 全部用带 setup.py 的 2022 版
                //   2) 不会自动安装传递依赖 → 必须把依赖树完整列出！
                install "fastapi==0.79.0"        // 最后支持 pydantic 1.x 的稳定版
                install "pydantic==1.10.13"      // 最后一个 pydantic 1.x（带 setup.py）
                install "starlette==0.19.1"      // fastapi 0.79 固定依赖
                install "uvicorn==0.20.0"        // 纯版本，不带 extras
                install "httpx==0.23.3"          // 2022 版，有 setup.py
                install "httpcore==0.15.0"       // httpx 0.23 的依赖（必须 <0.16）
                install "certifi==2022.12.7"     // httpx 依赖（CA 证书）
                install "idna==3.4"              // httpx / anyio 依赖
                install "anyio==3.6.2"           // starlette/httpx 异步依赖
                install "sniffio==1.3.0"         // anyio 依赖
                install "h11==0.14.0"            // uvicorn HTTP 协议
                install "click==8.1.3"           // uvicorn CLI 依赖
                install "typing-extensions==4.4.0"  // pydantic/starlette 依赖
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Sign with debug key for self-distribution; replace with your own key for Play Store.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
    }

    packagingOptions {
        pickFirst '**/libc++_shared.so'
    }

    // Chaquopy Python 源码目录
    sourceSets {
        main {
            python.srcDirs = ['src/main/python']
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
}